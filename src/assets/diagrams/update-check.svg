<svg class="dg" viewBox="0 0 760 352" role="img" aria-label="A channel mismatch is refused before anything changes" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:760px;height:auto;display:block;margin:1.5rem auto"><style>
.dg{font-family:inherit;font-size:13px}
.dg-box{fill:none;stroke:var(--sl-color-gray-3);stroke-width:1.25}
.dg-acc{fill:var(--sl-color-accent);fill-opacity:.14;stroke:var(--sl-color-accent);stroke-width:2}
.dg-bad{fill:none;stroke:var(--sl-color-red);stroke-width:1.75}
.dg-dash{stroke-dasharray:4 4}
.dg-t{fill:var(--sl-color-white)}
.dg-q{fill:var(--sl-color-gray-2);font-size:11.5px}
.dg-b{font-weight:600}
.dg-h{font-size:15px;font-weight:600;fill:var(--sl-color-white)}
.dg-line{fill:none;stroke:var(--sl-color-gray-3);stroke-width:1.25}
.dg-ah{fill:var(--sl-color-gray-3)}
</style><defs><marker id="update-check-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-ah"/></marker></defs><text x="24" y="34" class="dg-h">A channel mismatch is refused before anything changes</text><path d="M172 132H212" class="dg-line" marker-end="url(#update-check-ah)"/><path d="M360 132H400" class="dg-line" marker-end="url(#update-check-ah)"/><path d="M548 132H588" class="dg-line" marker-end="url(#update-check-ah)"/><path d="M474 184V240" class="dg-line" marker-end="url(#update-check-ah)"/><path d="M662 168V240" class="dg-line" marker-end="url(#update-check-ah)"/><rect x="24" y="96" width="148" height="72" rx="8" class="dg-box"/><text x="98.0" y="120" text-anchor="middle" class="dg-t dg-b">Admin</text><text x="98.0" y="136" text-anchor="middle" class="dg-q">signs a v4 that</text><text x="98.0" y="152" text-anchor="middle" class="dg-q">carries the channel</text><rect x="212" y="96" width="148" height="56" rx="8" class="dg-box"/><text x="286.0" y="120" text-anchor="middle" class="dg-t dg-b">Verify signature</text><text x="286.0" y="136" text-anchor="middle" class="dg-q">v1, v2, v3 or v4</text><rect x="400" y="96" width="148" height="88" rx="8" class="dg-acc"/><text x="474" y="120" text-anchor="middle" class="dg-t dg-b">Channel check</text><text x="474" y="136" text-anchor="middle" class="dg-t">follows that channel</text><text x="474" y="152" text-anchor="middle" class="dg-t">release is in it</text><text x="474" y="168" text-anchor="middle" class="dg-t">channel can be read</text><rect x="588" y="96" width="148" height="56" rx="8" class="dg-box"/><text x="662.0" y="120" text-anchor="middle" class="dg-t dg-b">Other checks</text><text x="662.0" y="136" text-anchor="middle" class="dg-q">baseline and drift</text><text x="568" y="124" text-anchor="middle" class="dg-q">pass</text><text x="482" y="216" class="dg-q">any one fails</text><rect x="380" y="240" width="188" height="56" rx="8" class="dg-bad"/><text x="474" y="264" text-anchor="middle" class="dg-t dg-b">Refused</text><text x="474" y="280" text-anchor="middle" class="dg-q">release_not_in_channel</text><rect x="588" y="240" width="148" height="72" rx="8" class="dg-box"/><text x="662.0" y="264" text-anchor="middle" class="dg-t dg-b">Rollout runs</text><text x="662.0" y="280" text-anchor="middle" class="dg-q">warm at 0%, steps,</text><text x="662.0" y="296" text-anchor="middle" class="dg-q">soak, rollback</text><text x="24" y="336" class="dg-q">A refusal leaves a record but does not claim a sequence number.</text></svg>