<svg class="dg" viewBox="0 0 760 332" role="img" aria-label="A staged rollout moves traffic in steps and returns to the old revision on a health breach" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:760px;height:auto;display:block;margin:1.5rem auto"><style>
.dg{font-family:inherit;font-size:13px}
.dg-box{fill:none;stroke:var(--sl-color-gray-3);stroke-width:1.25}
.dg-acc{fill:var(--sl-color-accent);fill-opacity:.14;stroke:var(--sl-color-accent);stroke-width:2}
.dg-bad{fill:none;stroke:var(--sl-color-red);stroke-width:1.75}
.dg-dash{stroke-dasharray:4 4}
.dg-t{fill:var(--sl-color-white)}
.dg-q{fill:var(--sl-color-gray-2);font-size:11.5px}
.dg-b{font-weight:600}
.dg-h{font-size:15px;font-weight:600;fill:var(--sl-color-white)}
.dg-line{fill:none;stroke:var(--sl-color-gray-3);stroke-width:1.25}
.dg-ah{fill:var(--sl-color-gray-3)}
</style><defs><marker id="rollout-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-ah"/></marker></defs><text x="24" y="34" class="dg-h">A staged rollout moves traffic in steps and can return to the old revision</text><path d="M172 110H212" class="dg-line" marker-end="url(#rollout-ah)"/><path d="M360 110H400" class="dg-line" marker-end="url(#rollout-ah)"/><path d="M548 110H588" class="dg-line" marker-end="url(#rollout-ah)"/><path d="M286 156V212" class="dg-line" marker-end="url(#rollout-ah)"/><path d="M474 156V212" class="dg-line" marker-end="url(#rollout-ah)"/><path d="M662 156V212" class="dg-line" marker-end="url(#rollout-ah)"/><rect x="24" y="76" width="148" height="80" rx="8" class="dg-box"/><text x="98" y="100" text-anchor="middle" class="dg-t dg-b">Warm up</text><text x="98" y="118" text-anchor="middle" class="dg-q">new release beside old</text><text x="98" y="136" text-anchor="middle" class="dg-q">new 0%, old 100%</text><rect x="212" y="76" width="148" height="80" rx="8" class="dg-box"/><text x="286" y="100" text-anchor="middle" class="dg-t dg-b">Step 1</text><text x="286" y="118" text-anchor="middle" class="dg-q">new 10%, old 90%</text><text x="286" y="136" text-anchor="middle" class="dg-q">soak, check health</text><rect x="400" y="76" width="148" height="80" rx="8" class="dg-box"/><text x="474" y="100" text-anchor="middle" class="dg-t dg-b">Step 2</text><text x="474" y="118" text-anchor="middle" class="dg-q">new 50%, old 50%</text><text x="474" y="136" text-anchor="middle" class="dg-q">soak, check health</text><rect x="588" y="76" width="148" height="80" rx="8" class="dg-acc"/><text x="662" y="100" text-anchor="middle" class="dg-t dg-b">Step 3</text><text x="662" y="118" text-anchor="middle" class="dg-q">new 100%</text><text x="662" y="136" text-anchor="middle" class="dg-q">old kept at 0%</text><text x="482" y="190" class="dg-q">health breach</text><rect x="212" y="212" width="524" height="72" rx="8" class="dg-bad"/><text x="228" y="236" class="dg-t dg-b">Roll back</text><text x="228" y="252" class="dg-q">with automatic rollback: traffic returns to the old revision</text><text x="228" y="268" class="dg-q">without it: traffic stays put and an admin decides</text><text x="24" y="312" class="dg-q">Each step soaks for five minutes by default and moves on only if health is good.</text></svg>