<svg class="dg" viewBox="0 0 760 320" role="img" aria-label="An environment follows one channel and a release must be promoted into it" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:760px;height:auto;display:block;margin:1.5rem auto"><style>
