</style><defs><marker id="channel-model-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-ah"/></marker></defs><text x="24" y="34" class="dg-h">An environment follows one channel, and a release must be promoted into it</text><path d="M160 132H212" class="dg-line" marker-end="url(#channel-model-ah)"/><path d="M348 132H400" class="dg-line" marker-end="url(#channel-model-ah)"/><path d="M280 216V166" class="dg-line" marker-end="url(#channel-model-ah)"/><path d="M468 216V166" class="dg-line" marker-end="url(#channel-model-ah)"/><rect x="24" y="104" width="136" height="56" rx="8" class="dg-box"/><text x="92.0" y="128" text-anchor="middle" class="dg-t dg-b">New release</text><text x="92.0" y="144" text-anchor="middle" class="dg-q">registered</text><rect x="212" y="104" width="136" height="56" rx="8" class="dg-acc"/><text x="280" y="128" text-anchor="middle" class="dg-t dg-b">dev channel</text><text x="280" y="144" text-anchor="middle" class="dg-q">early releases</text><rect x="400" y="104" width="136" height="56" rx="8" class="dg-acc"/><text x="468" y="128" text-anchor="middle" class="dg-t dg-b">stable channel</text><text x="468" y="144" text-anchor="middle" class="dg-q">trusted releases</text><text x="186" y="122" text-anchor="middle" class="dg-q">promote</text><text x="374" y="122" text-anchor="middle" class="dg-q">promote</text><text x="288" y="196" class="dg-q">follows</text><text x="476" y="196" class="dg-q">follows</text><rect x="24" y="216" width="136" height="72" rx="8" class="dg-box dg-dash"/><text x="92.0" y="240" text-anchor="middle" class="dg-t dg-b">Environment C</text><text x="92.0" y="256" text-anchor="middle" class="dg-q">no channel set</text><text x="92.0" y="272" text-anchor="middle" class="dg-q">not checked</text><rect x="212" y="216" width="136" height="72" rx="8" class="dg-box"/><text x="280.0" y="240" text-anchor="middle" class="dg-t dg-b">Environment B</text><text x="280.0" y="256" text-anchor="middle" class="dg-q">follows dev</text><text x="280.0" y="272" text-anchor="middle" class="dg-q">enforced</text><rect x="400" y="216" width="136" height="72" rx="8" class="dg-box"/><text x="468.0" y="240" text-anchor="middle" class="dg-t dg-b">Environment A</text><text x="468.0" y="256" text-anchor="middle" class="dg-q">follows stable</text><text x="468.0" y="272" text-anchor="middle" class="dg-q">enforced</text><text x="568" y="116" class="dg-q">Promote-only: a release</text><text x="568" y="132" class="dg-q">only moves forward and</text><text x="568" y="148" class="dg-q">a channel never silently</text><text x="568" y="164" class="dg-q">loses a release.</text></svg>