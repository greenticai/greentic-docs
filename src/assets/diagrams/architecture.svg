<svg class="dg" viewBox="0 0 760 364" role="img" aria-label="Four parts share one deploy: the admin console controls, the Designer deploys, the deployer ships and the runtime serves" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:760px;height:auto;display:block;margin:1.5rem auto"><style>
.dg{font-family:inherit;font-size:13px}
.dg-box{fill:none;stroke:var(--sl-color-gray-3);stroke-width:1.25}
.dg-acc{fill:var(--sl-color-accent);fill-opacity:.14;stroke:var(--sl-color-accent);stroke-width:2}
.dg-bad{fill:none;stroke:var(--sl-color-red);stroke-width:1.75}
.dg-dash{stroke-dasharray:4 4}
.dg-t{fill:var(--sl-color-white)}
.dg-q{fill:var(--sl-color-gray-2);font-size:11.5px}
.dg-b{font-weight:600}
.dg-h{font-size:15px;font-weight:600;fill:var(--sl-color-white)}
.dg-line{fill:none;stroke:var(--sl-color-gray-3);stroke-width:1.25}
.dg-ah{fill:var(--sl-color-gray-3)}
</style><defs><marker id="architecture-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-ah"/></marker></defs><text x="24" y="34" class="dg-h">Four parts share one deploy: control, deploy, ship and run</text><path d="M104 152V216" class="dg-line" marker-end="url(#architecture-ah)" marker-start="url(#architecture-ah)"/><path d="M184 260H224" class="dg-line" marker-end="url(#architecture-ah)"/><path d="M372 260H412" class="dg-line" marker-end="url(#architecture-ah)"/><rect x="24" y="64" width="348" height="88" rx="8" class="dg-acc"/><text x="40" y="88" class="dg-t dg-b">Admin console</text><text x="40" y="104" class="dg-q">tenants, teams and credentials</text><text x="40" y="120" class="dg-q">approvals, release catalogue, channels</text><text x="40" y="136" class="dg-q">signs staged updates, audit log</text><text x="116" y="190" class="dg-q">approvals, signed updates and results</text><rect x="24" y="216" width="160" height="88" rx="8" class="dg-box"/><text x="40" y="240" class="dg-t dg-b">Designer</text><text x="40" y="256" class="dg-q">environment canvas</text><text x="40" y="272" class="dg-q">builds and deploys</text><text x="40" y="288" class="dg-q">runs signed updates</text><rect x="224" y="216" width="148" height="88" rx="8" class="dg-box"/><text x="240" y="240" class="dg-t dg-b">Deployer</text><text x="240" y="256" class="dg-q">turns an environment</text><text x="240" y="272" class="dg-q">into running</text><text x="240" y="288" class="dg-q">infrastructure</text><rect x="412" y="200" width="324" height="120" rx="8" class="dg-box dg-dash"/><text x="428" y="224" class="dg-t dg-b">Runtime on your target</text><text x="428" y="242" class="dg-q">runs your units and answers messages</text><rect x="428" y="262" width="92" height="36" rx="8" class="dg-box"/><text x="474" y="284" text-anchor="middle" class="dg-q">Local</text><rect x="528" y="262" width="92" height="36" rx="8" class="dg-box"/><text x="574" y="284" text-anchor="middle" class="dg-q">Kubernetes</text><rect x="628" y="262" width="92" height="36" rx="8" class="dg-box"/><text x="674" y="284" text-anchor="middle" class="dg-q">Cloud Run</text><text x="24" y="350" class="dg-q">The deployer can also be driven by hand with the gtc command line.</text></svg>